<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

    <script>
      //calling get
      async function  add() {
        const a = document.getElementById('num1').value;
        const b = document.getElementById("num2").value;

        const res = await fetch("http://localhost:3000/sum/" + a + "/" + b );
        const json = await res.json();
        console.log(json);
        document.getElementById("result").innerHTML = json.ans;
      }

      //calling post
      async function  mul() {
        const a = document.getElementById('num1').value;
        const b = document.getElementById("num2").value;

        const res = await fetch("http://localhost:3000/mul/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            a: a,
            b: b
          })
        }
      );
        const json = await res.json();
        console.log(json);
        document.getElementById("result").innerHTML = json.ans;
      }
    </script>
 
</head>
<body class="background: "black">
  <h1>Calculator</h1>
  <input type="text" id="num1" placeholder="First Number">
  <input type="text" id="num2" placeholder="Second Number">

  <button onclick="add()" >Add</button>
  <button>Sub</button>
  <button>Mul</button>
  <button>Div</button>

  <p id="result"></p>
</body>
</html>
